name: Generate 3D Contribution Graph

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      # Generates the 3D contribution graph
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Style terminal landscape
        run: node scripts/theme-activity.mjs --landscape profile-3d-contrib/profile-night-view.svg assets/terminal/activity-landscape.svg
          
      # Commits the generated images directly to the repository
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib assets/terminal/activity-landscape.svg
          git commit -m "Generated 3D contribution graph" || echo "No changes to commit"
          git pull --rebase
          git push
