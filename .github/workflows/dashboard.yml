name: Refresh terminal dashboard
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-dashboard.mjs
      - scripts/animate-dashboard.mjs
      - .github/workflows/dashboard.yml
permissions:
  contents: write
concurrency:
  group: terminal-dashboard
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/generate-dashboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
      - name: Save dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-dashboard.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh terminal dashboard"
          git pull --rebase
          git push
